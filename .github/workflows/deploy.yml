name: Deploy Corpus to GitHub Pages

# site/ is rendered locally (scripts/render.py, scripts/home.py, scripts/country.py)
# and committed — never built in CI. DESIGN.md §8: the render depends on a
# local checkout of OSINT sitting beside this repo, which a runner does not
# have, and WeasyPrint's system dependencies (pango, cairo, ...) are a CI
# cost this repo has no reason to carry. This workflow only ever publishes
# what is already in site/ at the commit that triggered it.

on:
  push:
    branches: ["main"]
    # The workflow file itself too: a change to how the site deploys should deploy it.
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The artifact is named per attempt so "Re-run failed jobs" works. With the
      # default name a re-run finds the first attempt's upload beside its own and
      # deploy-pages refuses both ("Multiple artifacts named github-pages", 2026-09-11).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
          name: github-pages-${{ github.run_attempt }}

      # 10 minutes is deploy-pages' ceiling: a larger value is clamped to it (every
      # timed-out attempt on 2026-11-06 and 11-10 stopped at 10m04s). A deploy that
      # works takes seconds; one that hangs is a GitHub-side stall that a re-run an
      # hour later clears, which is scripts/deploy-state.py's backoff, not this step's.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
