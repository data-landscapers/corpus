<!--
  catalogue-prototype.html — Data Landscapers, Phase 3 (website)
  ---------------------------------------------------------------
  A working prototype of the catalogue browse-and-filter surface, over the
  REAL catalogue: all 7,770 records from outputs/catalogue/raw-catalogue.json.

  Double-click to open. Needs `catalogue-data.js` alongside it (regenerate with
  site/build-catalogue-data.py whenever the catalogue is rebuilt). No server, no
  network, no build step — everything runs in the browser from local files.

  What it is testing (see site/DESIGN.md §4):
    - facet counts that update against the other active filters, so you never
      click into an empty result
    - type-ahead inside the long facet lists (62 places, 38 topics)
    - the filter state living in the URL hash, so a filtered view is citable
    - whether 7,770 rows still feels friendly

  What it is NOT: the real site. No account wall, no downloads, no styling
  system, no accessibility pass. Design and interaction only.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — Data Landscapers</title>
<style>
  :root{
    --ink:#1b1b1b; --muted:#6b6b68; --faint:#8f8f8b; --line:#e4e2dd;
    --accent:#7a1f2b; --bg:#faf9f7; --card:#fff; --chip:#f0ede8;
    --warn:#8a5a12; --warnbg:#faeeda;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header.site{border-bottom:1px solid var(--line);background:var(--card)}
  .siteinner{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:22px;font-size:14px}
  .brand{font-weight:600;letter-spacing:-.01em}
  .siteinner nav{display:flex;gap:18px;color:var(--muted)}
  .siteinner nav .on{color:var(--ink);font-weight:500}
  .signin{margin-left:auto;color:var(--accent)}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 90px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
  .lede{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:60ch}

  .searchrow{display:flex;gap:10px;margin-bottom:18px}
  #q{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;background:var(--card);color:var(--ink)}
  #q:focus{outline:none;border-color:var(--accent)}
  select.sort{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px;color:var(--ink)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;min-height:1px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);
    border-radius:20px;padding:4px 11px;font-size:13px;color:#4a4a46}
  .chip b{font-weight:500;color:var(--ink)}
  .chip button{border:0;background:none;cursor:pointer;color:var(--faint);font-size:15px;line-height:1;padding:0}
  .chip button:hover{color:var(--accent)}
  .clearall{font-size:13px;color:var(--accent);cursor:pointer;background:none;border:0;padding:4px 2px}

  .cols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:30px;align-items:start}

  .facet{border-bottom:1px solid var(--line);padding:0 0 14px;margin-bottom:14px}
  .facet:last-child{border-bottom:0}
  .facet h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
    margin:0 0 9px;font-weight:600}
  .ftype{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
    font-size:13px;margin-bottom:8px;background:var(--card);color:var(--ink)}
  .ftype:focus{outline:none;border-color:var(--accent)}
  .opts{max-height:236px;overflow-y:auto;margin:0 -4px}
  .opt{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:5px;
    cursor:pointer;font-size:13.5px;line-height:1.35}
  .opt:hover{background:var(--chip)}
  .opt input{margin:0;accent-color:var(--accent);flex:none}
  .opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  .opt.zero{opacity:.34}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
    margin:9px 0 3px;padding-left:4px}
  .grp:first-child{margin-top:0}

  .count{font-size:14px;color:var(--muted);margin:0 0 12px}
  .count b{color:var(--ink);font-weight:600}

  .row{border-bottom:1px solid var(--line);padding:13px 0;display:grid;
    grid-template-columns:92px minmax(0,1fr);gap:16px}
  .row .date{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums;padding-top:1px}
  .row .ttl{font-size:15px;margin:0 0 3px;line-height:1.4}
  .row .meta{font-size:13px;color:var(--muted);margin:0 0 6px}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{background:var(--chip);border-radius:4px;padding:2px 7px;font-size:12px;color:#55524c;cursor:pointer}
  .tag:hover{background:#e6e2da}
  .tag.pl{background:#eef1f4;color:#3f4d59}
  .tag.ln{background:#f4eef0;color:#6b3742}
  .flag{background:var(--warnbg);color:var(--warn);border-radius:4px;padding:2px 7px;font-size:12px}
  .empty{padding:44px 0;color:var(--muted);font-size:15px}
  .more{margin:22px 0 0;padding:10px 18px;border:1px solid var(--line);background:var(--card);
    border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink)}
  .more:hover{border-color:var(--accent);color:var(--accent)}
  .note{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--faint);max-width:70ch}
  @media (max-width:860px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="site">
  <div class="siteinner">
    <span class="brand">Data Landscapers</span>
    <nav>
      <span>Countries</span><span>Regions</span><span>Topics</span>
      <span class="on">Catalogue</span><span>Data</span><span>Method</span>
    </nav>
    <span class="signin">Sign in</span>
  </div>
</header>

<div class="wrap">
  <h1>Catalogue</h1>
  <p class="lede">Every source held in the base — what it is, who published it, when, and where to read it.
     Bodies are not republished; each record links to the publisher.</p>

  <div class="searchrow">
    <input id="q" type="search" placeholder="Search titles and publishers" autocomplete="off">
    <select class="sort" id="sort">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="az">Title A–Z</option>
    </select>
  </div>

  <div class="chips" id="chips"></div>

  <div class="cols">
    <aside id="facets"></aside>
    <main>
      <p class="count" id="count"></p>
      <div id="results"></div>
      <button class="more" id="more" hidden>Show more</button>
      <p class="note" id="note"></p>
    </main>
  </div>
</div>

<script src="catalogue-data.js"></script>
<script>
(function(){
  var D = window.CATALOGUE;
  var ROWS = D.rows;
  var T = {ttl:0, pub:1, date:2, places:3, topics:4, lens:5, url:6, slug:7, art:8, comp:9};
  var REGION_NAME = {XNA:'North Africa', XWA:'West Africa', XEA:'East Africa',
    XSA:'Southern Africa', XCA:'Central Africa', XAF:'Africa-wide', XSS:'Sub-Saharan', XHA:'Horn of Africa'};

  var state = {q:'', places:[], topics:[], lens:[], years:[], sort:'new', shown:100};

  ROWS.forEach(function(r){ r._s = (r[0] + ' ' + r[1]).toLowerCase(); r._y = r[2].slice(0,4); });

  function passes(r, skip){
    if (state.q && r._s.indexOf(state.q) === -1) return false;
    if (skip !== 'places' && state.places.length && !state.places.some(function(v){return r[3].indexOf(v)>-1;})) return false;
    if (skip !== 'topics' && state.topics.length && !state.topics.some(function(v){return r[4].indexOf(v)>-1;})) return false;
    if (skip !== 'lens'   && state.lens.length   && !state.lens.some(function(v){return r[5].indexOf(v)>-1;})) return false;
    if (skip !== 'years'  && state.years.length  && state.years.indexOf(r._y) === -1) return false;
    return true;
  }

  function counts(field, idx){
    var c = {};
    for (var i=0;i<ROWS.length;i++){
      var r = ROWS[i];
      if (!passes(r, field)) continue;
      var vals = idx === 'y' ? [r._y] : r[idx];
      for (var j=0;j<vals.length;j++) c[vals[j]] = (c[vals[j]]||0)+1;
    }
    return c;
  }

  function facetBlock(key, title, idx, labels, groups, groupNames, searchable){
    var c = counts(key, idx);
    var sel = state[key];
    var el = document.createElement('div');
    el.className = 'facet';
    var h = '<h3>' + title + '</h3>';
    if (searchable) h += '<input class="ftype" data-f="' + key + '" placeholder="Filter ' + title.toLowerCase() + '" autocomplete="off">';
    h += '<div class="opts" data-opts="' + key + '"></div>';
    el.innerHTML = h;

    var keys = Object.keys(labels).filter(function(k){ return c[k] || sel.indexOf(k)>-1; });
    if (idx === 'y') keys.sort().reverse();
    else keys.sort(function(a,b){ return (c[b]||0)-(c[a]||0) || labels[a].localeCompare(labels[b]); });

    var box = el.querySelector('[data-opts]');
    function paint(term){
      var html = '', lastG = null;
      keys.forEach(function(k){
        var lab = labels[k];
        if (term && lab.toLowerCase().indexOf(term) === -1) return;
        if (groups){
          var g = groups[k] || '—';
          if (g !== lastG){ html += '<div class="grp">' + (groupNames ? (groupNames[g]||g) : g) + '</div>'; lastG = g; }
        }
        var n = c[k] || 0;
        html += '<label class="opt' + (n ? '' : ' zero') + '">' +
          '<input type="checkbox" data-f="' + key + '" value="' + k + '"' + (sel.indexOf(k)>-1?' checked':'') + '>' +
          '<span class="lbl" title="' + lab.replace(/"/g,'&quot;') + '">' + lab + '</span>' +
          '<span class="n">' + n.toLocaleString() + '</span></label>';
      });
      box.innerHTML = html || '<div class="grp">no matches</div>';
    }
    paint('');
    if (searchable){
      el.querySelector('.ftype').addEventListener('input', function(){ paint(this.value.trim().toLowerCase()); });
    }
    return el;
  }

  function years(){ var o={}; ROWS.forEach(function(r){ if(r._y) o[r._y]=r._y; }); return o; }

  function drawFacets(){
    var f = document.getElementById('facets');
    var keep = {};
    f.querySelectorAll('.ftype').forEach(function(i){ keep[i.dataset.f] = i.value; });
    f.innerHTML = '';
    f.appendChild(facetBlock('places','Country', 3, D.places, D.regions, REGION_NAME, true));
    f.appendChild(facetBlock('topics','Topic', 4, D.topics, D.cats, null, true));
    f.appendChild(facetBlock('lens','Lens', 5, {sovereignty:'Sovereignty', colonialism:'Colonialism'}, null, null, false));
    f.appendChild(facetBlock('years','Year published', 'y', years(), null, null, false));
    f.querySelectorAll('.ftype').forEach(function(i){
      if (keep[i.dataset.f]) { i.value = keep[i.dataset.f]; i.dispatchEvent(new Event('input')); }
    });
  }

  function drawChips(){
    var c = document.getElementById('chips'), h = '';
    function add(key, label, val, text){
      h += '<span class="chip"><b>' + label + '</b> ' + text +
           ' <button data-rm="' + key + '" data-v="' + val + '" aria-label="Remove">&times;</button></span>';
    }
    state.places.forEach(function(v){ add('places','Country', v, D.places[v]||v); });
    state.topics.forEach(function(v){ add('topics','Topic', v, D.topics[v]||v); });
    state.lens.forEach(function(v){ add('lens','Lens', v, v); });
    state.years.forEach(function(v){ add('years','Year', v, v); });
    if (state.q) h += '<span class="chip"><b>Search</b> ' + state.q + ' <button data-rm="q" data-v="">&times;</button></span>';
    if (h) h += '<button class="clearall" id="clearall">Clear all</button>';
    c.innerHTML = h;
  }

  function drawResults(){
    var out = ROWS.filter(function(r){ return passes(r, null); });
    if (state.sort === 'old') out = out.slice().reverse();
    else if (state.sort === 'az') out = out.slice().sort(function(a,b){ return a[0].localeCompare(b[0]); });

    document.getElementById('count').innerHTML =
      '<b>' + out.length.toLocaleString() + '</b> of ' + ROWS.length.toLocaleString() + ' records';

    var slice = out.slice(0, state.shown), h = '';
    slice.forEach(function(r){
      var tags = '';
      r[3].slice(0,4).forEach(function(p){ tags += '<span class="tag pl" data-add="places" data-v="' + p + '">' + (D.places[p]||p) + '</span>'; });
      r[4].slice(0,4).forEach(function(t){ tags += '<span class="tag" data-add="topics" data-v="' + t + '">' + (D.topics[t]||t) + '</span>'; });
      r[5].forEach(function(l){ tags += '<span class="tag ln" data-add="lens" data-v="' + l + '">' + l + '</span>'; });
      if (r[9] === 'paywalled') tags += '<span class="flag">paywalled</span>';
      if (r[9] === 'excerpt') tags += '<span class="flag">excerpt only</span>';
      if (r[8]) tags += '<span class="flag">document held</span>';
      h += '<div class="row"><div class="date">' + (r[2]||'undated') + '</div><div>' +
           '<p class="ttl"><a href="' + r[6] + '" target="_blank" rel="noopener">' + esc(r[0]) + '</a></p>' +
           '<p class="meta">' + esc(r[1] || 'publisher not recorded') + '</p>' +
           '<div class="tags">' + tags + '</div></div></div>';
    });
    document.getElementById('results').innerHTML = h || '<p class="empty">Nothing matches those filters. Try removing one.</p>';
    var m = document.getElementById('more');
    m.hidden = out.length <= state.shown;
    m.textContent = 'Show more (' + Math.min(100, out.length - state.shown) + ' of ' + (out.length - state.shown).toLocaleString() + ' remaining)';
    document.getElementById('note').textContent =
      'Prototype over ' + ROWS.length.toLocaleString() + ' real catalogue records. Filter state is in the URL — copy the address bar to share this view.';
  }

  function esc(s){ return String(s).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }

  function writeHash(){
    var p = [];
    if (state.q) p.push('q=' + encodeURIComponent(state.q));
    ['places','topics','lens','years'].forEach(function(k){ if (state[k].length) p.push(k + '=' + state[k].join(',')); });
    if (state.sort !== 'new') p.push('sort=' + state.sort);
    history.replaceState(null, '', p.length ? '#' + p.join('&') : location.pathname);
  }
  function readHash(){
    (location.hash || '').replace(/^#/, '').split('&').forEach(function(kv){
      if (!kv) return;
      var i = kv.indexOf('='), k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1));
      if (k === 'q') { state.q = v.toLowerCase(); document.getElementById('q').value = v; }
      else if (k === 'sort') { state.sort = v; document.getElementById('sort').value = v; }
      else if (state[k] !== undefined) state[k] = v.split(',').filter(Boolean);
    });
  }

  function redraw(resetPage){
    if (resetPage !== false) state.shown = 100;
    drawFacets(); drawChips(); drawResults(); writeHash();
  }

  document.addEventListener('change', function(e){
    var t = e.target;
    if (t.dataset && t.dataset.f && t.type === 'checkbox'){
      var arr = state[t.dataset.f], v = t.value, i = arr.indexOf(v);
      if (t.checked && i === -1) arr.push(v); else if (!t.checked && i > -1) arr.splice(i, 1);
      redraw();
    }
    if (t.id === 'sort'){ state.sort = t.value; redraw(); }
  });

  document.addEventListener('click', function(e){
    var t = e.target;
    if (t.dataset && t.dataset.rm){
      if (t.dataset.rm === 'q'){ state.q = ''; document.getElementById('q').value = ''; }
      else { var a = state[t.dataset.rm], i = a.indexOf(t.dataset.v); if (i > -1) a.splice(i, 1); }
      redraw();
    }
    if (t.id === 'clearall'){
      state.q = ''; state.places = []; state.topics = []; state.lens = []; state.years = [];
      document.getElementById('q').value = ''; redraw();
    }
    if (t.dataset && t.dataset.add){
      var arr2 = state[t.dataset.add];
      if (arr2.indexOf(t.dataset.v) === -1) arr2.push(t.dataset.v);
      redraw();
    }
    if (t.id === 'more'){ state.shown += 100; drawResults(); }
  });

  var timer;
  document.getElementById('q').addEventListener('input', function(){
    var v = this.value.trim().toLowerCase();
    clearTimeout(timer);
    timer = setTimeout(function(){ state.q = v; redraw(); }, 120);
  });

  readHash();
  redraw();
})();
</script>
</body>
</html>
